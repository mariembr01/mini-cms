$kind: http-request
url: "{{base_url}}/api/login?Accept=application/json"
method: POST
queryParams:
  - key: Accept
    value: application/json
    disabled: false
    description: ""
body:
  type: json
  content: "{\r

    \    \"email\": \"test@example.com\",\r

    \    \"password\": \"password\"\r

    }"
scripts:
  - type: afterResponse
    code: "const data = pm.response.json();\r

      pm.collectionVariables.set(\"token\", data.token);"
    language: text/javascript
order: 1000
